# WattPilot AI - Nginx Configuration
# Serves the React SPA and proxies API requests to the FastAPI backend.

server {
    listen 80;
    server_name localhost;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # Serve the React SPA from the build output directory
    root /usr/share/nginx/html;
    index index.html;

    # --- API Proxy ---
    # Forward /api/* requests to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # Agent endpoints can be slow (~2-3 min)
    }

    # Forward /health requests to the backend container
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- SPA Routing ---
    # All unknown routes serve index.html for React Router to handle
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
